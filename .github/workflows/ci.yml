name: JStorageMark CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Checkstyle
        run: mvn -B checkstyle:check

      - name: SpotBugs
        run: mvn -B spotbugs:check

      - name: Run scoped test suite
        run: mvn -B test -Dtest=com.kira.jstoragemark.core.**,com.kira.jstoragemark.config.**,com.kira.jstoragemark.fs.**,com.kira.jstoragemark.metrics.**,com.kira.jstoragemark.result.**,com.kira.jstoragemark.report.**

      - name: Package shaded fat JAR
        run: mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jstoragemark-jar
          path: target/*.jar
